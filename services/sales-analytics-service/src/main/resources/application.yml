spring:
  application:
    name: sales-analytics-service
  profiles:
    default: local
  datasource:
    url: jdbc:h2:file:${APP_DATA_DIR:./.run/data}/sales-analytics
    username: sa
    password: ${ANALYTICS_DB_PASSWORD:}
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19094}
    consumer:
      # Grupo estable: la proyección y eventId se conservan en H2.
      group-id: sales-analytics-v1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
server:
  port: 8092
