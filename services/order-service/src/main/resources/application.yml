spring:
  application:
    name: order-service
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}

server:
  port: 8083

app:
  services:
    catalog: ${CATALOG_URL:http://localhost:8081}
    cart: ${CART_URL:http://localhost:8082}
    inventory: ${INVENTORY_URL:http://localhost:8085}
