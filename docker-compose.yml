name: nexotech-ep3
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.11
    hostname: zookeeper
    restart: unless-stopped
    mem_limit: 256m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:ActiveProcessorCount=1
    volumes:
      - ep3_zookeeper_data:/var/lib/zookeeper/data
      - ep3_zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD-SHELL, 'cub zk-ready localhost:2181 10']
      interval: 10s
      timeout: 15s
      retries: 10
  kafka1:
    image: confluentinc/cp-kafka:7.9.11
    hostname: kafka1
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - 127.0.0.1:19092:19092
    environment: &kafka_environment
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_JVM_PERFORMANCE_OPTS: -XX:ActiveProcessorCount=1 -XX:MaxMetaspaceSize=128m
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_HOSTNAME: kafka1
    volumes:
      - ep3_kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, 'kafka-broker-api-versions --bootstrap-server localhost:19092 >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 15
  kafka2:
    image: confluentinc/cp-kafka:7.9.11
    hostname: kafka2
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - 127.0.0.1:19094:19094
    environment:
      <<: *kafka_environment
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:19094
      KAFKA_JMX_HOSTNAME: kafka2
    volumes:
      - ep3_kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, 'kafka-broker-api-versions --bootstrap-server localhost:19094 >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 15
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    ports:
      - 127.0.0.1:8093:8080
    environment:
      JAVA_OPTS: -Xms64m -Xmx256m -XX:ActiveProcessorCount=1
      SERVER_SERVLET_CONTEXT_PATH: /dev/kafka
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      KAFKA_CLUSTERS_0_NAME: NexoTech-EP3
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: 'true'
      KAFKA_CLUSTERS_0_METRICS_TYPE: JMX
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME:-nexotech}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-local-dev-only}
  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: nexotech-rabbit1
    restart: unless-stopped
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    environment: &rabbit_environment
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-nexotech-local-cluster-cookie}
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME:-nexotech}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD:-local-dev-only}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +S 2:2
    volumes:
      - ep3_rabbit1_data:/var/lib/rabbitmq
      - ./rabbitmq/local-cluster.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 10s
      retries: 12
  rabbitmq2:
    image: rabbitmq:4.2-management
    hostname: nexotech-rabbit2
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - 127.0.0.1:5673:5672
      - 127.0.0.1:15673:15672
    environment: *rabbit_environment
    volumes:
      - ep3_rabbit2_data:/var/lib/rabbitmq
      - ./rabbitmq/local-cluster.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  ep3_zookeeper_data:
  ep3_zookeeper_log:
  ep3_kafka1_data:
  ep3_kafka2_data:
  ep3_rabbit1_data:
  ep3_rabbit2_data:
