# RabbitMQ de un nodo para desarrollo local (guest/guest).
# El cluster de 2 nodos de la EC2 está en rabbitmq/docker-compose.yml.
services:
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: nexotech-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
