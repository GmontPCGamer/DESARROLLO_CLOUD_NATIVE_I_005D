<p class="kicker">Cuenta</p>
<h2>Perfil protegido con MsalGuard</h2>
<p class="muted">Esta vista solo carga con sesión Entra ID. Los claims salen del token MSAL.</p>

@if (account(); as user) {
  <dl class="panel">
    <dt>Nombre</dt>
    <dd>{{ user.name }}</dd>
    <dt>Correo / Usuario</dt>
    <dd>{{ user.username }}</dd>
    <dt>ID (sub)</dt>
    <dd>{{ user.localAccountId }}</dd>
    <dt>ID de cuenta</dt>
    <dd>{{ user.homeAccountId }}</dd>
  </dl>
}
