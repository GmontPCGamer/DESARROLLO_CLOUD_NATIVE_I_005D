spring:
  application:
    name: backend
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  security:
    # Usuarios (preferred_username u oid del token) que reciben ROLE_ADMIN aunque
    # el tenant no tenga app roles configurados. Separados por coma.
    admin-users: ${APP_ADMIN_USERS:}
  services:
    catalog: ${CATALOG_URL:http://localhost:8081}
    cart: ${CART_URL:http://localhost:8082}
    orders: ${ORDERS_URL:http://localhost:8083}
    notifications: ${NOTIFICATIONS_URL:http://localhost:8084}
    inventory: ${INVENTORY_URL:http://localhost:8085}
    payments: ${PAYMENTS_URL:http://localhost:8086}
    shipping: ${SHIPPING_URL:http://localhost:8087}
    reviews: ${REVIEWS_URL:http://localhost:8088}
